server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ayni-api
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ayni_db?createDatabaseIfNotExist=false&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:ayni}
    password: ${DB_PASSWORD:ayni_local_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: America/Lima

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
