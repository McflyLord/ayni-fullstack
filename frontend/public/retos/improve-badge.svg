    <path id="star" d="M0 -18 L5.3 -5.6 L18 -5.6 L7.8 2.8 L11.6 16.2 L0 8.6 L-11.6 16.2 L-7.8 2.8 L-18 -5.6 L-5.3 -5.6 Z"/>
    <path id="spark" d="M0 -13 L3 -3 L13 0 L3 3 L0 13 L-3 3 L-13 0 L-3 -3 Z"/>
