<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-label="Trofeo dorado de esfuerzo con listón turquesa">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7CC"/>
      <stop offset="0.32" stop-color="#FFD75E"/>
      <stop offset="0.68" stop-color="#F0A31F"/>
      <stop offset="1" stop-color="#C87A0E"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF0"/>
      <stop offset="0.45" stop-color="#FFE58A"/>
      <stop offset="1" stop-color="#F2B52E"/>
    </linearGradient>
    <radialGradient id="purple" cx="0.5" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#6C2D88"/>
      <stop offset="0.62" stop-color="#4A1B60"/>
      <stop offset="1" stop-color="#290B38"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FE3D9"/>
      <stop offset="0.45" stop-color="#2FB8B0"/>
      <stop offset="1" stop-color="#117C7C"/>
    </linearGradient>
    <linearGradient id="ribbonDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A9A94"/>
      <stop offset="1" stop-color="#0A5A5A"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#F5EBDD"/>
      <stop offset="1" stop-color="#DCCDB8"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3B0"/>
      <stop offset="0.55" stop-color="#F6C244"/>
      <stop offset="1" stop-color="#D88C16"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD75E" stop-opacity="0.38"/>
      <stop offset="0.65" stop-color="#F0A31F" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F0A31F" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3B0A32" flood-opacity="0.32"/>
    </filter>
    <filter id="textShadow" x="-30%" y="-50%" width="160%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#063C3C" flood-opacity="0.65"/>
